<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Quest Prototype v4R Fixed 2</title>
<style>
:root{
  --bg:#0d1218;--panel:#18202a;--panel2:#222d39;--text:#eef3f7;--muted:#93a4b8;
  --line:#3b4756;--accent:#f2bd45;--good:#8edb87;--fog:#0a0d10ef;
}
*{box-sizing:border-box}
body{margin:0;background:#080b0f;color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;display:flex;justify-content:center}
#app{width:min(100vw,430px);min-height:100vh;background:linear-gradient(#10161d,#0d1218);position:relative;overflow:hidden;box-shadow:0 0 50px #000}
.screen{min-height:100vh;padding:22px 18px 92px}
.center{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
h1,h2,h3,p{margin-top:0}
h2{font-size:24px}
.sub{color:var(--muted);line-height:1.4}
.small{font-size:13px}
.card{border:1px solid var(--line);background:rgba(24,32,42,.96);border-radius:18px;padding:16px;margin:12px 0}
.btn{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:14px;padding:14px 16px;font-weight:750;font-size:16px;margin-top:10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:#d59f25;color:#211700}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.35;cursor:not-allowed}
.field{margin:14px 0}
label{display:block;color:#cbd5e1;font-size:13px;margin-bottom:7px}
input,textarea,select{width:100%;background:#0f151c;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font-size:15px}
textarea{min-height:86px}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;gap:10px;align-items:center;justify-content:space-between}
.stars{display:flex;gap:7px;font-size:34px;align-items:center}
.star{cursor:pointer;display:inline-block;width:36px;text-align:center}
.star.empty{color:#111;filter:drop-shadow(0 0 1px #fff7)}
.star.gold{color:#ffd34d}
.star-label{font-size:13px;color:var(--muted);margin-top:5px}
.tip{background:#fff4c7;color:#342600;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13px;font-weight:700;position:relative}
.tip:after{content:"";position:absolute;left:24px;bottom:-8px;border:8px solid transparent;border-top-color:#fff4c7;border-bottom:0}
.hud{position:absolute;top:0;left:0;right:0;padding:10px 12px;display:flex;justify-content:space-between;z-index:10;background:linear-gradient(#0b1016ee,#0b101600)}
.badge{background:#111821dd;border:1px solid var(--line);border-radius:12px;padding:7px 9px;font-size:12px}
.xpbar{width:96px;height:8px;border-radius:99px;background:#202b36;overflow:hidden;margin-top:4px}
.xpfill{height:100%;background:var(--accent)}
.settlement{min-height:100vh;position:relative;background:radial-gradient(circle at 50% 55%,#657654 0 21%,#46513f 21% 35%,#2e3830 35% 52%,#151b18 52% 100%)}
.world{position:absolute;inset:58px 0 80px}
.center-camp{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);width:168px;height:168px;border-radius:50%;border:1px dashed #b7c6a366;background:#6c8059aa}
.tree{position:absolute;font-size:62px;left:10px;top:18px}
.tent{position:absolute;font-size:48px;right:12px;top:68px}
.fire{position:absolute;font-size:42px;left:61px;bottom:10px}
.hero{position:absolute;font-size:34px;left:77px;top:73px}
.walkin{animation:walkin 1.1s ease-out}
@keyframes walkin{0%{transform:translate(-90px,60px);opacity:0}100%{transform:translate(0,0);opacity:1}}
.speech{position:absolute;left:50%;top:35%;transform:translateX(-50%);background:#f1f5f9;color:#20242a;border-radius:14px;padding:8px 12px;font-weight:800;box-shadow:0 4px 14px #0008;z-index:6}
.focus{position:absolute;left:50%;top:64%;transform:translateX(-50%);width:88px;height:56px;border-radius:30px;background:#f6c85a;color:#221700;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:28px;border:3px solid #fff2bc;box-shadow:0 8px 24px #0008;cursor:pointer;z-index:8}
.focus.pulse{animation:pulse 1.35s infinite}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}
.bottom{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1.2fr 1fr 1fr;gap:7px;padding:9px 10px 14px;background:#0d1218f2;border-top:1px solid var(--line);z-index:12}
.nav{min-height:52px;border:1px solid var(--line);background:#18202a;color:var(--text);border-radius:12px;font-size:12px;font-weight:750}
.nav.add{background:#30435a}
.hexring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:360px;height:360px;pointer-events:none}
.hex{position:absolute;width:86px;height:74px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:#71845d88;display:flex;align-items:center;justify-content:center;font-size:28px;pointer-events:auto;cursor:pointer}
.hex.fog{background:var(--fog);color:#2e3540}
.hex.selectable{box-shadow:0 0 0 3px #f5ca5b inset,0 0 20px #f5ca5b88}
.h0{left:137px;top:4px}.h1{left:244px;top:66px}.h2{left:244px;top:190px}.h3{left:137px;top:252px}.h4{left:30px;top:190px}.h5{left:30px;top:66px}
.toast{position:absolute;left:18px;right:18px;bottom:91px;background:#121922;border:1px solid var(--line);padding:12px 14px;border-radius:13px;z-index:20;box-shadow:0 10px 30px #0009;font-weight:750;text-align:center}
.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cornerstone{border:1px solid var(--line);background:#151c24;border-radius:14px;padding:14px;text-align:center;cursor:pointer}
.cornerstone strong{display:block;margin-top:8px;font-size:13px}
.cornerstone.disabled{opacity:.35;cursor:not-allowed;filter:grayscale(1)}
.focus-panel .card{margin:9px 0}.focus-empty{text-align:center;padding:28px 14px;color:var(--muted)}
.tabs{display:flex;gap:8px;margin:10px 0}
.tab{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:#151c24;color:var(--text);font-weight:700}
.tab.active{background:var(--accent);color:#221700}
.tree-list{margin-left:10px;border-left:2px solid #344150;padding-left:12px}
.item{padding:8px 0}.card.completed{border-left:5px solid var(--accent)}.detail-field{background:#111820;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:9px 0;color:#aab6c4}.detail-field b{display:block;color:#718095;font-size:11px;text-transform:uppercase;margin-bottom:4px}.build-bubble{position:absolute;transform:translate(-50%,-100%);background:#fff4c7;color:#342600;border:2px solid #d5a62c;border-radius:14px;padding:6px 9px;font-size:12px;font-weight:800;z-index:9}.hex-action{position:absolute;left:50%;top:76%;transform:translateX(-50%);z-index:15;width:190px}
.progress{height:8px;background:#25303a;border-radius:999px;overflow:hidden;margin-top:6px}
.progress>div{height:100%;background:var(--good)}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .field{margin:8px 0}.full{grid-column:1/-1}.sticky-actions{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100vw,430px);z-index:50;background:#0d1218f6;border-top:1px solid var(--line);padding:9px 10px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}.sticky-actions.two{grid-template-columns:1.4fr 1fr}.sticky-actions .btn{margin:0;padding:12px 10px;font-size:14px}.screen.with-sticky{padding-bottom:100px}.danger{border-color:#8e3d3d!important;background:#3a1717!important;color:#ffd5d5!important}

/* v4F */
.quest-view input:disabled,.quest-view select:disabled,.quest-view textarea:disabled{opacity:.72;color:#b6c0cc;background:#111820;-webkit-text-fill-color:#b6c0cc}
.hexboard{position:absolute;left:50%;top:50%;width:330px;height:330px;transform:translate(-50%,-50%)}
.hexboard .hex{position:absolute;margin:0}
.drag-handle{cursor:grab;touch-action:none;user-select:none;padding:4px 8px;border:1px solid var(--line);border-radius:8px;margin-right:7px}
.subrow{display:flex;align-items:center}

.chapter-row{display:flex;align-items:flex-start;gap:7px}
.chapter-main{flex:1;min-width:0}
.chapter-controls button{width:38px;height:34px;border:1px solid var(--line);background:#111820;color:var(--text);border-radius:9px;font-weight:900}
.chapter-subscroll{max-height:190px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-right:3px;margin-top:8px}
.dragging{opacity:.55}
.folder-meta{color:var(--muted);font-size:13px;line-height:1.35;margin-top:4px}
.quest-stars-mini{color:var(--muted);font-size:13px;margin-top:4px}
.due-summary{color:var(--muted);font-size:13px;margin:10px 2px;cursor:pointer}
.history-block{border-left:2px solid var(--line);padding-left:10px;margin-top:10px}

.instance-tabs{display:flex;gap:8px;margin:12px 0}
.instance-tab{flex:1;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#151c24;color:var(--text);font-size:13px;font-weight:700}
.instance-tab.active{background:var(--accent);color:#221700}
.inline-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.day-picker{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.day-dot{width:34px;height:34px;border-radius:50%;border:1px solid #667085;background:#20242c;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}.day-dot.selected{background:#f2c94c;color:#171717;border-color:#f2c94c;font-weight:700}.routine-row.completed{opacity:.62}.routine-date{font-weight:700}.check-row{display:flex;align-items:center;gap:10px}.check-row input{width:20px;height:20px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SAVE_KEY='lifequest_v4h';

const DEFAULT={
  screen:'character',
  character:null,pendingCharacter:null,
  xp:0,coins:0,level:1,
  quests:[],tutorialQuests:[],
  currentQuest:null,resolutionStars:0,
  innerRingUnlocked:false,outerRingUnlocked:false,
  cornerstoneUnlocked:false,cornerstonePlaced:null,
  placedCornerstone:null,pendingCornerstone:null,
  firstHomeReadyAt:null,firstHomeUpgraded:false,
  questTab:'all',
  chapterQuests:[],subQuests:[],
  constructionReadyAt:null,constructionStage:0,
  selectedHex:null,placedCornerstones:[],helpSeen:{chapter:false,rarity:false},detailReturn:'home',
  focusChapterId:null,focusTab:'due',movingCornerstone:null,chapterCollapsed:{},questLogFolder:null,
  requirements:{
    freeQuestCreated:false,freeQuestCompleted:false,
    questLogChecked:false,characterChecked:false,cornerstonePlaced:false,
    chapterCreated:false,subQuestCreated:false,childQuestCreated:false,childQuestCompleted:false,focusSelected:false
  }
};

const raw=localStorage.getItem(SAVE_KEY);
let state=raw?Object.assign({},DEFAULT,JSON.parse(raw)):{...DEFAULT};
state.quests=Array.isArray(state.quests)?state.quests:[];
state.tutorialQuests=Array.isArray(state.tutorialQuests)?state.tutorialQuests:[];
state.chapterQuests=Array.isArray(state.chapterQuests)?state.chapterQuests:[];
state.subQuests=Array.isArray(state.subQuests)?state.subQuests:[];
state.requirements=Object.assign({},DEFAULT.requirements,state.requirements||{});
state.placedCornerstones=Array.isArray(state.placedCornerstones)?state.placedCornerstones:[];
if(state.placedCornerstone&&state.placedCornerstone.hex!=null&&!state.placedCornerstones.length)state.placedCornerstones=[state.placedCornerstone];
state.helpSeen=Object.assign({chapter:false,rarity:false},state.helpSeen||{});
state.chapterCollapsed=state.chapterCollapsed||{};
state.questLogFolder=state.questLogFolder||null;
state.questInstanceViewId=state.questInstanceViewId||null;
state.extendQuestId=state.extendQuestId||null;
state.screen='home';
// v4Q testing build: bypass onboarding while preserving tutorial code.
if(!state.character)state.character={name:'Player',look:'Adventurer'};
state.xp=Math.max(state.xp||0,60);
state.level=Math.max(state.level||1,5);
state.cornerstoneUnlocked=true;state.innerRingUnlocked=true;state.outerRingUnlocked=true;
state.requirements=Object.assign({},state.requirements,{
  freeQuestCreated:true,freeQuestCompleted:true,questLogChecked:true,characterChecked:true,
  cornerstonePlaced:true,chapterCreated:true,subQuestCreated:true,childQuestCreated:true,
  childQuestCompleted:true,focusSelected:true
});
state.tutorialQuests.forEach(q=>{q.completed=true});
save();

function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(state))}
function go(screen){state.screen=screen;save();render()}
function reset(){localStorage.removeItem(SAVE_KEY);state=JSON.parse(JSON.stringify(DEFAULT));render()}
function app(){return document.getElementById('app')}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function currentTimeHM(){const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function cumulativeXPForLevel(level){
  if(level<=1)return 0;
  if(level===2)return 10;
  if(level===3)return 20;
  if(level===4)return 30;
  if(level===5)return 60;
  return 60+(level-5)*60;
}
function xpIntoCurrentLevel(){return state.xp-cumulativeXPForLevel(state.level)}
function xpNeededForNextLevel(){return cumulativeXPForLevel(state.level+1)-cumulativeXPForLevel(state.level)}
function evaluateLevel(){
  while(state.xp>=cumulativeXPForLevel(state.level+1)){state.level++}
  state.cornerstoneUnlocked=state.level>=3;
  state.innerRingUnlocked=state.level>=3;
  state.outerRingUnlocked=state.level>=5;
}
function addRewards(stars){state.xp+=stars*5;state.coins+=stars*5;evaluateLevel();save();syncTutorial()}
function getQuest(id){return state.quests.find(q=>q.id===id)}
function getTutorial(id){return state.tutorialQuests.find(q=>q.id===id)}
function cornerAt(i){return state.placedCornerstones.find(c=>c.hex===i)}
function unlockedHexIds(){return state.outerRingUnlocked?Array.from({length:18},(_,i)=>i):[0,1,2,3,4,5]}
function emptyHexes(){return unlockedHexIds().filter(i=>!cornerAt(i))}
function canPlaceCornerstone(){const standardNames=new Set(CORNERS?.map?.(o=>o[1])||[]),placed=new Set(state.placedCornerstones.map(c=>c.name));return state.cornerstoneUnlocked&&emptyHexes().length>0&&[...standardNames].some(n=>!placed.has(n))}
function axialRing(radius){
  const dirs=[[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];
  let q=0,r=-radius,out=[];
  for(let side=0;side<6;side++)for(let step=0;step<radius;step++){out.push([q,r]);q+=dirs[side][0];r+=dirs[side][1]}
  return out;
}
function hexPos(q,r,size=52){
  const x=size*Math.sqrt(3)*(q+r/2), y=size*1.5*r;
  return {left:165+x,top:165+y};
}
function boardHexes(){
  const inner=axialRing(1).map((a,i)=>({id:i,q:a[0],r:a[1],ring:1}));
  const outer=axialRing(2).map((a,i)=>({id:6+i,q:a[0],r:a[1],ring:2}));
  return state.outerRingUnlocked?inner.concat(outer):inner;
}
function cornerstoneOptions(){return state.placedCornerstones||[]}
function subQuestCornerstoneNames(){return ['Free Quest',...cornerstoneNames()]}
function orderedChapters(name){return state.chapterQuests.filter(c=>c.cornerstone===name).sort((a,b)=>(a.order??999)-(b.order??999)||new Date(a.createdAt||0)-new Date(b.createdAt||0))}
function normalizeChapterOrders(name){orderedChapters(name).forEach((c,i)=>c.order=i)}
function chaptersForCornerstone(name){return orderedChapters(name)}
function subsForChapter(id){return state.subQuests.filter(s=>s.chapterId===id)}
function freeSubQuests(){return state.subQuests.filter(s=>s.freeStanding||!s.chapterId)}
function questHierarchyFor(q){if(!q.parentSubQuestId)return {};const sub=state.subQuests.find(s=>s.id===q.parentSubQuestId);if(sub&&(sub.freeStanding||!sub.chapterId))return {sub,chapter:null,cornerstone:'Free Quest'};const chapter=sub&&state.chapterQuests.find(c=>c.id===sub.chapterId);return {sub,chapter,cornerstone:chapter?.cornerstone}}

function tutorialActive(id){const q=getTutorial(id);return q && !q.completed}
function addTutorial(id,title,stars,description,requirementKey){
  if(!getTutorial(id)) state.tutorialQuests.push({id,title,stars,description,type:'Tutorial Quest',completed:false,earnedStars:0,requirementKey,createdAt:new Date().toISOString()});
}
function syncTutorial(){
  addTutorial('t1','Complete Your First Quest',1,'Learn how the completion survey works.','characterCreated');
  const t1=getTutorial('t1');
  if(t1?.completed) addTutorial('t2','Create and Complete a Free Quest',2,'Create your own 1-star Free Quest, complete it, then return here. Hint: Check your Quest Log for active Quests.','freeQuestCompleted');
  if(state.level>=3){
    addTutorial('t3a','Check Your Quest Log',1,'Open your Quest Log, then return here.','questLogChecked');
    addTutorial('t3b','Check Your Character Profile',1,'Open your Character Profile, then return here.','characterChecked');
    addTutorial('t3c','Place Your First Cornerstone',1,'Use the + Create menu to choose and place a Cornerstone, then return here.','cornerstonePlaced');
  }
  if(state.requirements.cornerstonePlaced) addTutorial('t4','Create Your First Chapter Quest',1,'Tap your Cornerstone, then use Create Quest to make a Chapter Quest and choose its Archetype.','chapterCreated');
  if(state.requirements.chapterCreated) addTutorial('t5','Create Your First Sub-Quest',1,'Create a Sub-Quest inside your Chapter Quest, then return here.','subQuestCreated');
  if(state.requirements.subQuestCreated) addTutorial('t6','Create an Active Quest',1,'Create an Active Quest inside your Sub-Quest, then return here.','childQuestCreated');
  if(state.requirements.childQuestCreated) addTutorial('t7','Complete Your Active Quest',1,'Complete the Active Quest inside your Sub-Quest, then return here.','childQuestCompleted');
  if(state.requirements.childQuestCompleted) addTutorial('t8','Choose Your Focus Quest',1,'Choose the Chapter Quest that matters most to you right now. Your Focus Bubble will use it to show only a few manageable next steps.','focusSelected');
  save();
}
function requirementSatisfied(tq){
  if(!tq)return false;
  if(tq.id==='t1')return !!state.character;
  return !!state.requirements[tq.requirementKey];
}
function completeTutorialFromSurvey(id,stars){
  const tq=getTutorial(id); if(!tq||tq.completed)return;
  tq.completed=true;tq.earnedStars=Math.min(stars,tq.stars);
  addRewards(tq.earnedStars);
}
function starDisplay(max,earned,completed){
  if(!completed)return '★'.repeat(max);
  return '⭐'.repeat(earned||0)+'★'.repeat(Math.max(0,max-(earned||0)));
}

function questLineageRoot(q){
  if(!q)return null;
  const rootId=q.rootQuestId||q.id;
  return state.quests.find(x=>x.id===rootId)||q;
}
function cumulativeEarnedStars(q){
  const root=questLineageRoot(q);if(!root)return 0;
  const vals=state.quests.filter(x=>(x.rootQuestId||x.id)===root.id).map(x=>x.earnedStars||0);
  return Math.min(root.stars||0,Math.max(root.earnedStars||0,...vals));
}
function filteredQuest(q,filter){return filter==='active'?!q.completed:filter==='completed'?!!q.completed:true}
function subQuestStats(subId,filter='all'){
  const qs=state.quests.filter(q=>q.parentSubQuestId===subId);
  const roots=new Map();
  qs.forEach(q=>{const r=questLineageRoot(q);if(r)roots.set(r.id,r)});
  const unique=[...roots.values()];
  const completeCount=unique.filter(r=>state.quests.filter(x=>(x.rootQuestId||x.id)===r.id).some(x=>x.completed)).length;
  const totalCount=unique.length;
  const earned=unique.reduce((s,r)=>s+cumulativeEarnedStars(r),0);
  const max=unique.reduce((s,r)=>s+(r.stars||0),0);
  const visible=unique.filter(r=>filteredQuest(state.quests.filter(x=>(x.rootQuestId||x.id)===r.id).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0))[0]||r,filter)).length;
  return {visible,completeCount,totalCount,earned,max};
}
function chapterQuestStats(chapterId,filter='all'){
  const subs=state.subQuests.filter(s=>s.chapterId===chapterId);
  const vals=subs.map(s=>subQuestStats(s.id,filter));
  return {visible:vals.reduce((a,v)=>a+v.visible,0),completeCount:vals.reduce((a,v)=>a+v.completeCount,0),totalCount:vals.reduce((a,v)=>a+v.totalCount,0),earned:vals.reduce((a,v)=>a+v.earned,0),max:vals.reduce((a,v)=>a+v.max,0)};
}
function questLineageHistory(q){
  const root=questLineageRoot(q);if(!root)return [];
  return state.quests.filter(x=>(x.rootQuestId||x.id)===root.id).sort((a,b)=>new Date(a.createdAt||0)-new Date(b.createdAt||0));
}
function reopenQuest(id){
  const original=getQuest(id);if(!original||!original.completed)return;
  const root=questLineageRoot(original),current=cumulativeEarnedStars(root);
  if(current>=root.stars)return;
  const q={...root,
    id:'q-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),
    title:`${root.title} - Reopened`,
    completed:false,
    completedAt:null,
    earnedStars:current,
    createdAt:new Date().toISOString(),
    rootQuestId:root.id,
    reopenedFromId:original.id
  };
  state.quests.push(q);
  state.questInstanceViewId=q.id;
  save();
  state.currentQuest={kind:'quest',...q};
  state.detailReturn='questList';
  go('questDetail');
}
function openQuestFolder(kind,id=null){state.questLogFolder={kind,id};save();render()}
function folderBack(){
  const f=state.questLogFolder;
  if(!f){go('home');return}
  if(f.kind==='sub'){const s=state.subQuests.find(x=>x.id===f.id);state.questLogFolder={kind:'chapter',id:s?.chapterId||null};save();render();return}
  state.questLogFolder=null;save();render();
}

function currentTutorial(){return null}

function character(){
  return `<div class="screen">
    <h2>Create Character</h2>
    <div class="card center"><div style="font-size:72px">🧍</div><p class="sub small">Placeholder avatar.</p></div>
    <div class="field"><label>Name</label><input id="charName" placeholder="Your name"></div>

function isRecurring(q){return !!q && !!q.repeat && q.repeat!=='Never'}
function focusEligible(q){return !q.completed && !isRecurring(q)}
function questDeadline(q){
  if(!q.timeLimitDate)return null;
  const t=q.timeLimitTime||'23:59';const d=new Date(`${q.timeLimitDate}T${t}:00`);return isNaN(d)?null:d;
}
function dueSoonQuests(){
  const now=new Date(),limit=new Date(now.getTime()+3*24*60*60*1000);
  return state.quests.filter(q=>focusEligible(q)).map(q=>({q,d:questDeadline(q)})).filter(x=>x.d&&x.d<=limit).sort((a,b)=>a.d-b.d).slice(0,2).map(x=>x.q);
}
function focusChapterQuests(){
  if(!state.focusChapterId)return [];
  const subs=new Set(state.subQuests.filter(s=>s.chapterId===state.focusChapterId).map(s=>s.id));
  return state.quests.filter(q=>subs.has(q.parentSubQuestId)&&focusEligible(q)).sort(activeQuestSort).slice(0,3);
}
function focusQuestCard(q){const d=questDeadline(q);const due=d?`${d<new Date()?'Overdue · ':''}${q.timeLimitDate}${q.timeLimitTime?' · '+q.timeLimitTime:' · End of day'}`:'No deadline';return `<div class="card" onclick="openLoggedQuest('${q.id}',false)"><div class="between"><strong>${esc(q.title)}</strong><span>${starDisplay(q.stars,q.earnedStars||0,q.completed)}</span></div><div class="sub small">${esc(due)}</div></div>`}
function setFocusTab(tab){state.focusTab=tab;save();render()}
function dueSummaryCounts(){
  const now=new Date(),today=todayISO(),limit=new Date(now.getTime()+3*86400000);
  const all=state.quests.filter(q=>focusEligible(q)).map(q=>({q,d:questDeadline(q)})).filter(x=>x.d);
  return {overdue:all.filter(x=>x.d<now).length,dueToday:all.filter(x=>x.q.timeLimitDate===today).length,next3:all.filter(x=>x.d>=now&&x.d<=limit).length};
}
function dueList(){
  const now=new Date(),today=todayISO();
  const td=new Date();td.setDate(td.getDate()+1);const tomorrow=`${td.getFullYear()}-${String(td.getMonth()+1).padStart(2,'0')}-${String(td.getDate()).padStart(2,'0')}`;
  const limit=new Date(now.getTime()+3*86400000);
  const qs=state.quests.filter(q=>focusEligible(q)).map(q=>({q,d:questDeadline(q)})).filter(x=>x.d).sort((a,b)=>a.d-b.d);
  const groups=[['Overdue',qs.filter(x=>x.d<now)],['Today',qs.filter(x=>x.q.timeLimitDate===today&&x.d>=now)],['Tomorrow',qs.filter(x=>x.q.timeLimitDate===tomorrow)],['Next 3 Days',qs.filter(x=>x.d>now&&x.d<=limit&&x.q.timeLimitDate!==today&&x.q.timeLimitDate!==tomorrow)]];
  return `<div class="screen"><h2>Due Quests</h2>${groups.map(([name,items])=>items.length?`<h3>${name}</h3>${items.map(x=>focusQuestCard(x.q)).join('')}`:'').join('')||'<div class="focus-empty">No due Quests.</div>'}<button class="btn ghost" onclick="go('focusView')">Back</button></div>`;
}
function scheduledOnDate(q,dateISO){
  if(!isRecurring(q))return false;const d=new Date(dateISO+'T12:00:00'),start=new Date((q.seriesStartDate||q.startDate||dateISO)+'T12:00:00');if(d<start)return false;
  if(q.repeat==='Daily')return true;
  if(q.repeat==='Weekly')return d.getDay()===start.getDay();
  if(q.repeat==='Monthly')return d.getDate()===start.getDate();
  if(q.repeat==='Custom')return (q.repeatDays||[]).includes(d.getDay());
  return false;
}
function ensureRecurringOccurrences(){
  const today=todayISO();const templates=new Map();
  state.quests.filter(isRecurring).forEach(q=>{const sid=q.seriesId||q.id;q.seriesId=sid;if(!q.seriesStartDate)q.seriesStartDate=q.startDate||q.timeLimitDate||today;if(!q.occurrenceDate)q.occurrenceDate=q.timeLimitDate||q.startDate||today;if(!templates.has(sid)||q.occurrenceDate<templates.get(sid).occurrenceDate)templates.set(sid,q)});
  templates.forEach((t,sid)=>{let d=new Date(t.seriesStartDate+'T12:00:00'),last=new Date(today+'T12:00:00');for(let guard=0;d<=last&&guard<730;guard++,d.setDate(d.getDate()+1)){const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;if(!scheduledOnDate(t,iso))continue;if(state.quests.some(q=>q.seriesId===sid&&q.occurrenceDate===iso))continue;state.quests.push({...t,id:'q-'+Date.now()+'-'+guard,rootQuestId:null,completed:false,earnedStars:0,completedAt:null,occurrenceDate:iso,startDate:iso,timeLimitDate:iso,seriesId:sid});}}
  );save();
}
function recurringSeries(){ensureRecurringOccurrences();const m=new Map();state.quests.filter(isRecurring).forEach(q=>{const sid=q.seriesId||q.id;if(!m.has(sid))m.set(sid,[]);m.get(sid).push(q)});return m}
function dailySeriesCards(){
  const today=todayISO(),out=[];recurringSeries().forEach((items,sid)=>{const todays=items.find(q=>q.occurrenceDate===today);if(!todays)return;const overdue=items.filter(q=>!q.completed&&q.occurrenceDate<today).length;out.push({sid,q:todays,overdue});});
  return out.sort((a,b)=>Number(a.q.completed)-Number(b.q.completed)||a.q.title.localeCompare(b.q.title));
}
function dailyCard(x){return `<div class="card routine-row ${x.q.completed?'completed':''}" onclick="openRoutineFolder('${x.sid}')"><div class="between"><strong>${esc(x.q.title)}</strong><span>${x.q.completed?'✓ '+starDisplay(x.q.stars,x.q.earnedStars||0,true):starDisplay(x.q.stars,x.q.earnedStars||0,false)}</span></div><div class="sub small">${x.q.completed?'Completed today':'Today'}${x.overdue?' · '+x.overdue+' overdue':''}</div></div>`}
function focusView(){
  ensureRecurringOccurrences();const chapter=state.chapterQuests.find(c=>c.id===state.focusChapterId);const due=dueSoonQuests(),fq=focusChapterQuests(),daily=dailySeriesCards();const tab=state.focusTab==='routine'?'daily':(state.focusTab||'due');
  let body='';
  if(tab==='focus')body=chapter?`<div class="card"><div class="between"><div><strong>${esc(chapter.title)}</strong><div class="sub small">${esc(chapter.cornerstone)}</div></div><button class="btn" style="width:auto;margin:0" onclick="openHierarchyDetail('chapter','${chapter.id}')">Open Chapter</button></div></div>${fq.length?fq.map(focusQuestCard).join(''):'<div class="focus-empty">No non-repeatable Active Quests are waiting here.</div>'}<button class="btn primary" onclick="${state.subQuests.some(s=>s.chapterId===chapter.id)?`openCreateActiveQuest('${state.subQuests.find(s=>s.chapterId===chapter.id).id}')`:`openHierarchyDetail('chapter','${chapter.id}')`}">＋ Active Quest</button><button class="btn" onclick="go('focusChoose')">Change Focus Quest</button>`:`<div class="focus-empty">Choose a Chapter Quest to make it your Focus.</div><button class="btn primary" onclick="go('focusChoose')">Choose Focus Quest</button>`;
  else if(tab==='daily')body=`${daily.length?daily.map(dailyCard).join(''):'<div class="focus-empty">No recurring Quests scheduled for today.</div>'}<button class="btn" onclick="state.questLogFolder={kind:'recurring'};go('questList')">View All Recurring Quests</button>`;
  else body=`${due.length?due.map(focusQuestCard).join(''):'<div class="focus-empty">Nothing due in the next 3 days.</div>'}${(()=>{const c=dueSummaryCounts();return `<div class="due-summary" onclick="go('dueList')">${c.overdue?c.overdue+' overdue · ':''}${c.dueToday?c.dueToday+' due today · ':''}${c.next3} due in next 3 days</div>`})()}`;
  return `<div class="screen focus-panel"><h2>Focus</h2><div class="tabs"><button class="tab ${tab==='due'?'active':''}" onclick="setFocusTab('due')">Due Soon</button><button class="tab ${tab==='focus'?'active':''}" onclick="setFocusTab('focus')">Focus</button><button class="tab ${tab==='daily'?'active':''}" onclick="setFocusTab('daily')">Daily</button></div>${body}<button class="btn ghost" onclick="go('home')">Back</button></div>`;

function setResolution(n){const q=state.currentQuest;if(q?.kind==='quest'&&q.rootQuestId){const base=cumulativeEarnedStars(q);if(n<base)return}state.resolutionStars=state.resolutionStars===n?0:n;save();render()}
function submitResolution(){
  const q=state.currentQuest;const prior=(q.kind==='quest'&&q.rootQuestId)?(getQuest(q.id)?.earnedStars||0):0;const earned=Math.min(state.resolutionStars,q.stars);const rewardDelta=Math.max(0,earned-prior);
  if(q.kind==='tutorial'){
    completeTutorialFromSurvey(q.id,earned);
    if(q.id==='t1'&&!state.firstHomeReadyAt&&!state.firstHomeUpgraded)state.firstHomeReadyAt=Date.now()+5*60*1000;
  }else{
    const rec=getQuest(q.id);
    if(rec&&!rec.completed){
      rec.completed=true;rec.earnedStars=earned;rec.completedAt=new Date().toISOString();
      addRewards(q.rootQuestId?rewardDelta:earned);
      if(rec.tutorialFree){state.requirements.freeQuestCompleted=true}
      if(rec.parentSubQuestId){
        state.requirements.childQuestCompleted=true;
        if(!state.constructionReadyAt)state.constructionReadyAt=Date.now()+60*60*1000;
        updateChapterProgress(rec.parentSubQuestId);
      }
    }
  }
  state.currentQuest=null;state.resolutionStars=0;syncTutorial();save();go('reward');
}

function saveQuestEditor(mode,id){
  const title=document.getElementById('qeTitle').value.trim();
  const endDate=document.getElementById('qeEndDate').value;
  if(!title||!endDate){alert('Title and Time Limit Date are required.');return}
  const type=document.getElementById('qeType').value;
  const sub=type==='Cornerstone Quest'?(document.getElementById('qeSub')?.value||''):'';
  if(type==='Cornerstone Quest'&&!sub){alert('Choose a Sub-Quest for this Active Quest.');return}
  const reminder=document.getElementById('qeReminder').value;
  const reminderDate=document.getElementById('qeReminderDate')?.value||'';
  const reminderTime=document.getElementById('qeReminderTime')?.value||'';
  if(reminder==='Custom'&&!reminderDate){alert('Choose a Reminder Date for a custom reminder.');return}
  const base={
    type:type==='Free Quest'?'Free Quest':'Quest',
    title,
    description:document.getElementById('qeDesc').value.trim(),
    stars:createStars,
    startDate:document.getElementById('qeStartDate').value,
    startTime:document.getElementById('qeStartTime').value,
    timeLimitDate:endDate,
    timeLimitTime:document.getElementById('qeEndTime').value,
    repeat:document.getElementById('qeRepeat').value,
    repeatDays:[...document.querySelectorAll('#customRepeatWrap .day-dot.selected')].map(x=>Number(x.dataset.day)),
    reminder,
    reminderDate:reminder==='Custom'?reminderDate:'',
    reminderTime:reminder==='Custom'?reminderTime:'',
    parentSubQuestId:type==='Cornerstone Quest'?sub:null
  };
  if(mode==='edit'){
    const q=getQuest(id);if(!q)return;
    Object.assign(q,base);
    const root=questLineageRoot(q);
    state.quests.filter(x=>(x.rootQuestId||x.id)===root.id).forEach(x=>{
      x.parentSubQuestId=base.parentSubQuestId;
      x.type=base.type;
    });
    save();state.currentQuest={kind:'quest',...q};go('questDetail');return;
  }
  const t2=getTutorial('t2');
  const isTutorialFree=type==='Free Quest'&&!!t2&&!t2.completed&&!state.requirements.freeQuestCreated;
  if(isTutorialFree&&createStars!==1){alert('For this tutorial, create a 1-star Free Quest.');return}
  const q={id:'q-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),...base,completed:false,earnedStars:0,createdAt:new Date().toISOString(),tutorialFree:isTutorialFree};

  if(isTutorialFree)state.requirements.freeQuestCreated=true;
  if(type==='Cornerstone Quest'&&!state.requirements.childQuestCreated)state.requirements.childQuestCreated=true;
  const d=state.editorDefaults||{};state.editorDefaults={};
  syncTutorial();save();
  if(d.returnType&&d.returnId){openHierarchyDetail(d.returnType,d.returnId);return}
  go(type==='Cornerstone Quest'?'cornerstoneLanding':'home');
}

function orderedSubs(chapterId){

function moveSubQuest(id,dir){
  const s=state.subQuests.find(x=>x.id===id);if(!s)return;
  normalizeSubOrders(s.chapterId);
  const arr=orderedSubs(s.chapterId),i=arr.findIndex(x=>x.id===id),j=Math.max(0,Math.min(arr.length-1,i+dir));
  if(i===j)return;
  const oi=arr[i].order,oj=arr[j].order;arr[i].order=oj;arr[j].order=oi;save();render();
}

function subDrop(ev,targetId){

  const a=state.subQuests.find(x=>x.id===sourceId),b=state.subQuests.find(x=>x.id===targetId);if(!a||!b||a.chapterId!==b.chapterId)return;
  normalizeSubOrders(a.chapterId);const arr=orderedSubs(a.chapterId),from=arr.findIndex(x=>x.id===sourceId),to=arr.findIndex(x=>x.id===targetId);
  const [m]=arr.splice(from,1);arr.splice(to,0,m);arr.forEach((x,i)=>x.order=i);draggedSub=null;save();render();
}

function beginPointerReorder(e,kind,id){if(e.pointerType==='mouse')return;e.preventDefault();e.stopPropagation();e.currentTarget.setPointerCapture?.(e.pointerId);pointerDrag={kind,id,pid:e.pointerId,target:null};e.currentTarget.classList.add('dragging')}
function movePointerReorder(e){if(!pointerDrag||pointerDrag.pid!==e.pointerId)return;e.preventDefault();const el=document.elementFromPoint(e.clientX,e.clientY);const row=el?.closest?.(pointerDrag.kind==='sub'?'[data-sub-id]':'[data-chapter-id]');if(row)pointerDrag.target=pointerDrag.kind==='sub'?row.dataset.subId:row.dataset.chapterId}
function endPointerReorder(e){if(!pointerDrag||pointerDrag.pid!==e.pointerId)return;e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove('dragging');const d=pointerDrag;pointerDrag=null;if(!d.target||d.target===d.id)return;if(d.kind==='sub'){const a=state.subQuests.find(x=>x.id===d.id),b=state.subQuests.find(x=>x.id===d.target);if(!a||!b||a.chapterId!==b.chapterId)return;normalizeSubOrders(a.chapterId);reorderIn(orderedSubs(a.chapterId),d.id,d.target)}else{const a=state.chapterQuests.find(x=>x.id===d.id),b=state.chapterQuests.find(x=>x.id===d.target);if(!a||!b||a.cornerstone!==b.cornerstone)return;normalizeChapterOrders(a.cornerstone);reorderIn(orderedChapters(a.cornerstone),d.id,d.target)}save();render()}

  const chosenCorner=document.getElementById('subCornerstone').value;const chapterId=chosenCorner==='Free Quest'?null:document.getElementById('subChapter').value;if(chosenCorner!=='Free Quest'&&!chapterId){alert('Choose a Chapter Quest.');return}
  const d=state.subQuestDefaults||{};
  state.subQuests.push({id:'s-'+Date.now(),chapterId,freeStanding:chosenCorner==='Free Quest',title,description:document.getElementById('subDesc').value.trim(),rarity:document.getElementById('subRarity').value,order:state.subQuests.filter(s=>s.chapterId===chapterId).length,createdAt:new Date().toISOString()});
  state.requirements.subQuestCreated=true;state.subQuestDefaults=null;syncTutorial();save();
  if(d.returnType&&d.returnId){openHierarchyDetail(d.returnType,d.returnId);return}go('cornerstoneLanding');
}
let childStars=1;
function createChildQuest(){
  return `<div class="screen"><h2>New Active Quest</h2><div class="field"><label>Sub-Quest</label><select id="childSub">${state.subQuests.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select></div><div class="field"><label>Stars</label><div class="stars" id="childStars">${[1,2,3].map(n=>`<span class="star ${n===1?'gold':'empty'}" data-n="${n}" onclick="pickChildStars(${n})">★</span>`).join('')}</div></div><div class="field"><label>Title</label><input id="childTitle"></div><div class="row"><div class="field" style="flex:1"><label>Start Date</label><input id="childStartDate" type="date" value="${todayISO()}"></div><div class="field" style="flex:1"><label>Start Time</label><input id="childStartTime" type="time" value="${currentTimeHM()}"></div></div><div class="row"><div class="field" style="flex:1"><label>Time Limit — Date</label><input id="childDate" type="date" value="${todayISO()}"></div><div class="field" style="flex:1"><label>Time (Optional)</label><input id="childTime" type="time"></div></div><button class="btn primary" onclick="submitChildQuest()">＋ Create Active Quest</button><button class="btn ghost" onclick="go('cornerstoneLanding')">Back</button></div>`;
}
function pickChildStars(n){childStars=n;document.querySelectorAll('#childStars .star').forEach(el=>{const on=Number(el.dataset.n)<=n;el.classList.toggle('gold',on);el.classList.toggle('empty',!on)})}
function submitChildQuest(){
  const title=document.getElementById('childTitle').value.trim();if(!title){alert('Title is required.');return}
  state.quests.push({id:'q-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),type:'Quest',title,description:'',stars:childStars,startDate:document.getElementById('childStartDate').value,startTime:document.getElementById('childStartTime').value,timeLimitDate:document.getElementById('childDate').value,timeLimitTime:document.getElementById('childTime').value,completed:false,earnedStars:0,createdAt:new Date().toISOString(),parentSubQuestId:document.getElementById('childSub').value});
  state.requirements.childQuestCreated=true;syncTutorial();save();go('cornerstoneLanding');
}
function updateChapterProgress(subId){
  const sub=state.subQuests.find(s=>s.id===subId);if(!sub)return;
  const chapter=state.chapterQuests.find(c=>c.id===sub.chapterId);if(!chapter)return;
  const q=state.quests.filter(x=>x.parentSubQuestId===sub.id);chapter.progress=q.length?Math.round(q.filter(x=>x.completed).length/q.length*100):0;
}

function menu(){return `<div class="screen"><h2>Menu</h2><div class="card"><button class="btn" onclick="go('home')">Return to Settlement</button><button class="btn ghost" onclick="if(confirm('Reset all prototype progress and start over?'))reset()">Reset Prototype / Start Over</button></div></div>`}

function render(){
  const map={character,confirmCharacter,arrival,home,questDetail,resolve,reward,createMenu,createQuestMenu,createBuildingMenu,createQuest,questList,characterProfile,cornerstonePick,placeCornerstone,cornerstoneLanding,cornerstoneCreateMenu,createChapter,createSubQuest,createChildQuest,focusView,focusChoose,dueList,routineFolder,bulkResolve,extendQuest,menu};
  app().innerHTML=(map[state.screen]||home)();
}
syncTutorial();
render();
</script>
